name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  verify:
    name: typecheck · lint · test · demo · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Headless scenario (run twice, must be identical)
        run: |
          npm run demo -- --json > run1.json
          npm run demo -- --json > run2.json
          diff <(node -e 'const j=require("./run1.json");console.log(JSON.stringify({ok:j.ok,decisions:j.decisions,artefacts:j.artefacts,head:j.ledger.head}))') \
               <(node -e 'const j=require("./run2.json");console.log(JSON.stringify({ok:j.ok,decisions:j.decisions,artefacts:j.artefacts,head:j.ledger.head}))')
          npm run demo
      - run: npm run build

  e2e:
    name: browser smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
